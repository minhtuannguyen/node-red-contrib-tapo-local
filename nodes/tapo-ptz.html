<!-- ── tapo-ptz node ──────────────────────────────────────────────────────── -->
<script type="text/javascript">
    RED.nodes.registerType('tapo-ptz', {
        category:  'Tapo',
        color:     '#00b4d8',
        defaults: {
            name:         { value: '' },
            device:       { value: '', type: 'tapo-onvif-device', required: true },
            onvifPort:    { value: '2020', validate: RED.validators.number() },
            profileToken: { value: 'MediaProfile000' },
            action:       { value: 'continuousMove' },
            pan:          { value: '0' },
            tilt:         { value: '0' },
            preset:       { value: '' },
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-video-camera',
        label: function () {
            return this.name || this.action || 'tapo-ptz';
        },
        oneditprepare: function () {
            function updateRows() {
                const action = $('#node-input-action').val();
                $('#ptz-row-speeds').toggle(action === 'continuousMove');
                $('#ptz-row-preset').toggle(action === 'gotoPreset');
            }
            $('#node-input-action').on('change', updateRows);
            updateRows();
        },
    });
</script>

<script type="text/html" data-template-name="tapo-ptz">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-camera"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-onvifPort"><i class="fa fa-plug"></i> ONVIF port</label>
        <input type="number" id="node-input-onvifPort" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-profileToken"><i class="fa fa-id-card"></i> Profile token</label>
        <input type="text" id="node-input-profileToken" style="width:200px" placeholder="MediaProfile000">
        <span style="margin-left:8px;color:#888">C225 default: <code>MediaProfile000</code></span>
    </div>
    <div class="form-row">
        <label for="node-input-action"><i class="fa fa-arrows"></i> Action</label>
        <select id="node-input-action" style="width:70%">
            <option value="continuousMove">Continuous Move (pan/tilt until Stop)</option>
            <option value="stop">Stop</option>
            <option value="gotoPreset">Go to Preset</option>
            <option value="getPresets">Get Presets</option>
        </select>
    </div>
    <div id="ptz-row-speeds">
        <div class="form-row">
            <label for="node-input-pan"><i class="fa fa-arrows-h"></i> Pan speed</label>
            <input type="number" id="node-input-pan" step="0.1" min="-1" max="1" style="width:80px">
            <span style="margin-left:8px;color:#888">−1 (left) · 0 (none) · 1 (right)</span>
        </div>
        <div class="form-row">
            <label for="node-input-tilt"><i class="fa fa-arrows-v"></i> Tilt speed</label>
            <input type="number" id="node-input-tilt" step="0.1" min="-1" max="1" style="width:80px">
            <span style="margin-left:8px;color:#888">−1 (down) · 0 (none) · 1 (up)</span>
        </div>
    </div>
    <div id="ptz-row-preset" class="form-row">
        <label for="node-input-preset"><i class="fa fa-map-marker"></i> Preset token</label>
        <input type="text" id="node-input-preset" placeholder="e.g. 1  (use Get Presets to discover)">
    </div>
</script>

<script type="text/html" data-help-name="tapo-ptz">
    <p>ONVIF PTZ control for Tapo C225 — zero npm deps, raw SOAP.</p>
    <p>Select a <b>tapo-onvif-device</b> config node (Camera Account credentials).</p>
    <h3>Actions</h3>
    <dl class="message-properties">
        <dt>continuousMove</dt><dd>Move at pan/tilt speed until a <em>stop</em> command.</dd>
        <dt>stop</dt><dd>Stop all movement.</dd>
        <dt>gotoPreset</dt><dd>Move to a preset position by token.</dd>
        <dt>getPresets</dt><dd>Return preset list in <code>msg.payload</code>.</dd>
    </dl>
    <h3>Runtime overrides</h3>
    <dl class="message-properties">
        <dt>msg.action <span class="property-type">string</span></dt><dd>Override configured action.</dd>
        <dt>msg.pan <span class="property-type">number</span></dt><dd>Pan speed −1…1.</dd>
        <dt>msg.tilt <span class="property-type">number</span></dt><dd>Tilt speed −1…1.</dd>
        <dt>msg.preset <span class="property-type">string</span></dt><dd>Preset token for gotoPreset.</dd>
    </dl>
    <p>
        PTZ commands automatically interrupt the <b>tapo-onvif-events</b> poll loop
        for ~200 ms so the C225's single connection slot is free — no delay, no missed events.
    </p>
</script>
