<!-- ── tapo-device config node ───────────────────────────────────────────── -->
<script type="text/javascript">
    RED.nodes.registerType('tapo-device', {
        category:    'config',
        defaults: {
            name:     { value: '' },
            ip:       { value: '', required: true },
            username: { value: 'admin', required: true },
        },
        credentials: {
            password: { type: 'password' },
        },
        label: function () { return this.name || this.ip || 'Tapo Device'; },
    });
</script>

<script type="text/html" data-template-name="tapo-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="optional label">
    </div>
    <div class="form-row">
        <label for="node-config-input-ip"><i class="fa fa-globe"></i> IP</label>
        <input type="text" id="node-config-input-ip" placeholder="192.168.1.100">
    </div>
    <div class="form-row">
        <label for="node-config-input-username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-config-input-username" placeholder="admin">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-lock"></i> Password</label>
        <input type="password" id="node-config-input-password">
    </div>
</script>

<script type="text/html" data-help-name="tapo-device">
    <p>Configuration for a Tapo C225 camera.</p>
    <p>Use the camera account password from <b>Tapo app → Settings → Advanced → Camera Account</b>.
    This may differ from your TP-Link cloud password.</p>
</script>


<!-- ── tapo-c225 command node ───────────────────────────────────────────── -->
<script type="text/javascript">
    RED.nodes.registerType('tapo-local', {
        category: 'tapo',
        color:    '#5bb8f5',
        defaults: {
            name:    { value: '' },
            device:  { value: '', type: 'tapo-device', required: true },
            command: { value: 'privacy-on' },
        },
        inputs:  1,
        outputs: 1,
        icon:    'camera.png',
        label:      function () { return this.name || this.command || 'Tapo Local'; },
        labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    });
</script>

<script type="text/html" data-template-name="tapo-local">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="optional">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-video-camera"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-command"><i class="fa fa-cog"></i> Command</label>
        <select id="node-input-command" style="width:70%">
            <optgroup label="Privacy">
                <option value="privacy-on">Privacy ON (lens covered)</option>
                <option value="privacy-off">Privacy OFF (lens open)</option>
            </optgroup>
            <optgroup label="Alarm">
                <option value="alarm-on">Alarm auto-ON (on detection)</option>
                <option value="alarm-off">Alarm auto-OFF</option>
                <option value="alarm-trigger">Alarm trigger NOW (siren + light)</option>
                <option value="alarm-stop">Alarm stop</option>
            </optgroup>
            <optgroup label="Detection">
                <option value="motion-on">Motion detection ON</option>
                <option value="motion-off">Motion detection OFF</option>
                <option value="person-on">Person detection ON (AI)</option>
                <option value="person-off">Person detection OFF (AI)</option>
            </optgroup>
            <optgroup label="Camera">
                <option value="led-on">LED ON</option>
                <option value="led-off">LED OFF</option>
                <option value="night-vision-on">Night vision ON (always IR)</option>
                <option value="night-vision-off">Night vision OFF (always day)</option>
                <option value="night-vision-auto">Night vision AUTO</option>
            </optgroup>
            <optgroup label="System">
                <option value="reboot">Reboot</option>
            </optgroup>
        </select>
    </div>
    <div class="form-tips">
        Override at runtime by setting <code>msg.command</code> to any of the values above
        (e.g. <code>privacy-on</code>, <code>alarm-trigger</code>, <code>motion-off</code>, …).
    </div>
</script>

<script type="text/html" data-help-name="tapo-local">
    <p>Controls a Tapo C225 camera via its local HTTPS API — no cloud required.</p>

    <h3>Input</h3>
    <p>Any message triggers the configured command.
    Set <code>msg.command</code> to override the node setting at runtime.</p>

    <h3>Commands</h3>
    <ul>
        <li><b>Privacy:</b> <code>privacy-on</code> — cover the lens; <code>privacy-off</code> — uncover</li>
        <li><b>Alarm (auto):</b> <code>alarm-on</code> / <code>alarm-off</code> — enable/disable alarm on detected events</li>
        <li><b>Alarm (manual):</b> <code>alarm-trigger</code> — immediately sound siren+light; <code>alarm-stop</code> — stop it</li>
        <li><b>Motion detection:</b> <code>motion-on</code> / <code>motion-off</code></li>
        <li><b>Person detection (AI):</b> <code>person-on</code> / <code>person-off</code></li>
        <li><b>LED:</b> <code>led-on</code> / <code>led-off</code></li>
        <li><b>Night vision:</b> <code>night-vision-on</code> (always IR) / <code>night-vision-off</code> (always day) / <code>night-vision-auto</code></li>
        <li><b>System:</b> <code>reboot</code></li>
    </ul>

    <h3>Output</h3>
    <p><code>msg.payload</code> &mdash; <code>{ command, result }</code></p>

    <h3>Notes</h3>
    <p>Tested with <b>Tapo C225</b> firmware 1.2.x.
    Auth sessions are cached (10 min) and serialised per device — concurrent nodes share one session safely.</p>
</script>
